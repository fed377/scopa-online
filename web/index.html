<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="An online scopa game.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="scopa">
  <link rel="apple-touch-icon" href="diamond_red.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="diamond_red.png"/>

  <title>Scopa</title>
  <meta name="theme-color" content="#19612B">
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(to top, #34C759, #19612B); }
    #loading {
      position: fixed; top: 50%; left: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
      border: 4px solid rgba(255, 255, 255, 0.25); border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="loading" aria-label="Loading"></div>
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('loading')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
